<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8fc" />
    <meta name="description" content="小智，记录生活、整理记忆、陪你完成今天。" />
    <title>小智｜你的个人生活系统</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell" id="app-shell">
      <div class="ambient ambient-blue"></div>
      <div class="ambient ambient-peach"></div>
      <header class="app-header">
        <div class="header-copy">
          <p class="date-line" data-date-line>2026年10月12日 · 星期一</p>
          <h1 data-greeting>早上好，朋友</h1>
          <p class="header-subtitle">记录生活的美好，慢慢成为更懂自己的你。</p>
        </div>
        <button class="profile-orb" type="button" data-tab="me" aria-label="打开我的页面"><img src="assets/xiaozhi-mascot-pink-blue.png" alt="粉蓝色小智伙伴" /><span class="online-dot"></span></button>
      </header>

      <section class="view-stack" id="view-stack" aria-live="polite"></section>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="nav-item is-active" type="button" data-tab="home"><span class="nav-icon">⌂</span><span>首页</span></button>
        <button class="nav-item" type="button" data-tab="memory"><span class="nav-icon">◉</span><span>记忆</span></button>
        <button class="chat-fab" type="button" data-tab="chat" aria-label="打开和小智对话"><span>•••</span></button>
        <button class="nav-item" type="button" data-tab="box"><span class="nav-icon">▣</span><span>Box</span></button>
        <button class="nav-item" type="button" data-tab="me"><span class="nav-icon">◎</span><span>我的</span></button>
      </nav>
    </main>

    <div class="modal-layer" data-modal hidden>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" type="button" data-close-modal aria-label="关闭">×</button>
        <p class="section-kicker">QUICK CAPTURE</p>
        <h2 id="modal-title">把此刻交给小智</h2>
        <p class="modal-copy" data-modal-copy>先记录，不急着分类。之后可以在记忆里慢慢整理。</p>
        <label for="modal-input" class="field-label">内容</label>
        <textarea id="modal-input" rows="4" placeholder="今天发生了什么，或者你突然想到了什么？"></textarea>
        <div class="modal-actions"><button class="text-button" type="button" data-close-modal>暂时不记</button><button class="primary-button" type="button" data-save-modal>保存记忆 <span>↗</span></button></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8fc" />
    <meta name="description" content="小智，记录生活、整理记忆、陪你完成今天。" />
    <title>小智｜你的个人生活系统</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell" id="app-shell">
      <div class="ambient ambient-blue"></div>
      <div class="ambient ambient-peach"></div>
      <header class="app-header">
        <div class="header-copy">
          <p class="date-line" data-date-line>2026年10月12日 · 星期一</p>
          <h1 data-greeting>早上好，朋友</h1>
          <p class="header-subtitle">记录生活的美好，慢慢成为更懂自己的你。</p>
          <p class="cloud-status" data-cloud-status>未登录 · 本地模式</p>
        </div>
        <button class="profile-orb" type="button" data-tab="me" aria-label="打开我的页面"><img data-header-avatar class="avatar-pink-blue" src="assets/xiaozhi-mascot-pink-blue.png" alt="粉蓝色小智伙伴" /><span class="online-dot"></span></button>
      </header>

      <section class="view-stack" id="view-stack" aria-live="polite">
        <section class="view home-view initial-fallback">
          <article class="glass-card companion-card"><div class="mascot-wrap"><img src="assets/xiaozhi-mascot-pink-blue.png" alt="粉蓝色小智伙伴" /></div><div class="companion-copy"><p class="micro-label">小智陪伴你</p><h2>和你一起，慢慢成长</h2><p>正在加载你的生活空间…</p></div></article>
          <article class="glass-card empty-state"><strong>正在连接小智</strong><p>如果页面长时间没有变化，请刷新一次。</p></article>
        </section>
      </section>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="nav-item is-active" type="button" data-tab="home"><span class="nav-icon">⌂</span><span>首页</span></button>
        <button class="nav-item" type="button" data-tab="memory"><span class="nav-icon">◉</span><span>记忆</span></button>
        <button class="chat-fab" type="button" data-tab="chat" aria-label="打开和小智对话"><span>•••</span></button>
        <button class="nav-item" type="button" data-tab="box"><span class="nav-icon">▣</span><span>Box</span></button>
        <button class="nav-item" type="button" data-tab="me"><span class="nav-icon">◎</span><span>我的</span></button>
      </nav>
    </main>

    <div class="modal-layer" data-modal hidden>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" type="button" data-close-modal aria-label="关闭">×</button>
        <p class="section-kicker">QUICK CAPTURE</p>
        <h2 id="modal-title">把此刻交给小智</h2>
        <p class="modal-copy" data-modal-copy>先记录，不急着分类。之后可以在记忆里慢慢整理。</p>
        <label for="modal-input" class="field-label" data-modal-label>内容</label>
        <textarea id="modal-input" rows="4" placeholder="今天发生了什么，或者你突然想到了什么？"></textarea>
        <div class="modal-actions"><button class="text-button" type="button" data-close-modal data-modal-cancel>暂时不记</button><button class="primary-button" type="button" data-save-modal>保存记忆 <span>↗</span></button></div>
      </section>
    </div>

    <div class="modal-layer profile-editor-layer" data-profile-editor hidden>
      <section class="modal-card profile-editor-card" role="dialog" aria-modal="true" aria-labelledby="profile-editor-title">
        <button class="modal-close" type="button" data-profile-close aria-label="关闭">×</button>
        <p class="section-kicker">YOUR PROFILE</p>
        <h2 id="profile-editor-title">编辑个人资料</h2>
        <p class="modal-copy">换一个更像你的名字和头像。登录后会同步到云端，未登录时保存在本机。</p>
        <label class="field-label" for="profile-name">怎么称呼你</label>
        <input class="profile-name-input" id="profile-name" type="text" maxlength="24" autocomplete="nickname" placeholder="输入昵称" />
        <p class="field-label avatar-label">选择头像</p>
        <div class="avatar-picker" role="radiogroup" aria-label="选择头像">
          <button class="avatar-option avatar-pink-blue" type="button" data-avatar-option="pink-blue" role="radio" aria-label="粉蓝小智"><img src="assets/xiaozhi-mascot-pink-blue.png" alt="" /></button>
          <button class="avatar-option avatar-sky" type="button" data-avatar-option="sky" role="radio" aria-label="天空蓝小智"><img src="assets/xiaozhi-mascot-pink-blue.png" alt="" /></button>
          <button class="avatar-option avatar-lilac" type="button" data-avatar-option="lilac" role="radio" aria-label="丁香紫小智"><img src="assets/xiaozhi-mascot-pink-blue.png" alt="" /></button>
          <button class="avatar-option avatar-peach" type="button" data-avatar-option="peach" role="radio" aria-label="暖橙小智"><img src="assets/xiaozhi-mascot-pink-blue.png" alt="" /></button>
          <button class="avatar-option avatar-mint" type="button" data-avatar-option="mint" role="radio" aria-label="薄荷绿小智"><img src="assets/xiaozhi-mascot-pink-blue.png" alt="" /></button>
        </div>
        <p class="profile-editor-status" data-profile-status></p>
        <div class="modal-actions"><button class="text-button" type="button" data-profile-cancel>取消</button><button class="primary-button" type="button" data-profile-save>保存资料 ↗</button></div>
      </section>
    </div>

    <div class="auth-layer" data-auth-modal hidden>
      <section class="auth-card" role="dialog" aria-modal="true" aria-labelledby="auth-title">
        <button class="modal-close" type="button" data-auth-close aria-label="关闭">×</button>
        <p class="section-kicker">CLOUD ACCOUNT</p>
        <h2 id="auth-title">登录小智云端</h2>
        <p class="modal-copy" data-auth-copy>登录后，记忆、任务、Box 和对话可以跨设备保存。</p>
        <label class="field-label" for="auth-email">邮箱</label>
        <input class="auth-input" id="auth-email" type="email" autocomplete="email" placeholder="you@example.com" />
        <label class="field-label" for="auth-password">密码</label>
        <div class="password-field">
          <input class="auth-input" id="auth-password" type="password" autocomplete="current-password" placeholder="至少 6 位" />
          <button class="password-toggle" type="button" data-password-toggle aria-label="显示密码">显示</button>
        </div>
        <p class="auth-status" data-auth-status></p>
        <button class="text-button auth-resend" type="button" data-auth-resend hidden>重新发送验证邮件</button>
        <div class="modal-actions"><button class="text-button" type="button" data-auth-switch>还没有账号？注册</button><button class="primary-button" type="button" data-auth-submit>登录并同步 ↗</button></div>
        <button class="text-button auth-logout" type="button" data-auth-logout hidden>退出当前账号</button>
      </section>
    </div>

    <script type="module" src="script.js?v=4"></script>
  </body>
</html>
